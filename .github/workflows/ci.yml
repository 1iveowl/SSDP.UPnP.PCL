name: CI

on:
  push:
    branches: [main, master, "releases/**"]
    tags: ["v*"]
  pull_request:

env:
  CI: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Interim step while SimpleHttpListener.Rx 7.x and HttpMachine.PCL 6.x
      # complete NuGet validation: pack them from source into the local feed.
      # Remove this step (and the local-feed source in nuget.config) once both
      # packages are indexed on nuget.org.
      - name: Bootstrap local package feed
        run: |
          mkdir -p local-feed
          git clone --depth 1 https://github.com/1iveowl/HttpMachine.PCL external/HttpMachine.PCL
          sed -i 's|<AssemblyName>HttpMachine</AssemblyName>|<AssemblyName>HttpMachine</AssemblyName>\n    <PackageId>HttpMachine.PCL</PackageId>|' \
            external/HttpMachine.PCL/src/main/HttpMachine.netstandard/HttpMachine.netstandard.csproj
          dotnet pack external/HttpMachine.PCL/src/interface/IHttpMachine/IHttpMachine.csproj -c Release -o local-feed
          dotnet pack external/HttpMachine.PCL/src/main/HttpMachine.netstandard/HttpMachine.netstandard.csproj -c Release -o local-feed
          git clone --depth 1 https://github.com/1iveowl/SimpleHttpListener.Rx external/SimpleHttpListener.Rx
          dotnet pack external/SimpleHttpListener.Rx/src/SimpleHttpListener.Rx/SimpleHttpListener.Rx.csproj -c Release -o local-feed \
            -p:RestoreAdditionalProjectSources=${{ github.workspace }}/local-feed

      - name: Restore
        run: dotnet restore SSDP.UPnP.PCL.slnx

      - name: Build
        run: dotnet build SSDP.UPnP.PCL.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/SSDP.UPnP.PCL.Tests/SSDP.UPnP.PCL.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/SSDP.UPnP.PCL/SSDP.UPnP.PCL.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
