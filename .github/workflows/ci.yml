name: CI

on:
  push:
    branches: [main, master, "releases/**"]
    tags: ["v*"]
  pull_request:

env:
  CI: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SSDP.UPnP.PCL.slnx

      - name: Build
        run: dotnet build SSDP.UPnP.PCL.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/SSDP.UPnP.PCL.Tests/SSDP.UPnP.PCL.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/SSDP.UPnP.PCL/SSDP.UPnP.PCL.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # Required for NuGet Trusted Publishing: the job exchanges the GitHub OIDC
      # token for a short-lived nuget.org API key — no stored secrets.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Requires a Trusted Publishing policy on nuget.org (profile → Trusted
      # Publishing) for repository 1iveowl/SSDP.UPnP.PCL, workflow ci.yml.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
