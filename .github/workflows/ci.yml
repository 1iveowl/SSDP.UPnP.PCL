name: CI

on:
  push:
    branches: [main, master, "releases/**"]
    tags: ["v*"]
  pull_request:

env:
  CI: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # On a v* tag the tag is the single source of truth for the package
      # version, so the release version cannot drift from the tag: v8.0.0
      # packs 8.0.0. Off a tag, the csproj <Version> is used as-is.
      - name: Resolve package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "pack_args=-p:Version=$version" >> "$GITHUB_OUTPUT"
            echo "Packing tagged release $version"
          else
            echo "pack_args=" >> "$GITHUB_OUTPUT"
            echo "Packing csproj version (untagged build)"
          fi

      - name: Restore
        run: dotnet restore SSDP.UPnP.PCL.slnx

      - name: Build
        run: dotnet build SSDP.UPnP.PCL.slnx -c Release --no-restore -warnaserror

      # The whole solution, not one project: the analyzer tests live in their own
      # project and were not being run at all.
      - name: Test
        run: dotnet test SSDP.UPnP.PCL.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/SSDP.UPnP.PCL/SSDP.UPnP.PCL.csproj -c Release --no-build -o artifacts ${{ steps.version.outputs.pack_args }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # id-token: NuGet Trusted Publishing exchanges the GitHub OIDC token for a
      # short-lived nuget.org API key — no stored secrets.
      # contents: write — needed to create the GitHub Release for the tag.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Requires a Trusted Publishing policy on nuget.org (profile → Trusted
      # Publishing) for repository 1iveowl/SSDP.UPnP.PCL, workflow ci.yml.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Publishing the package and cutting the GitHub Release happen together, so
      # the two can never disagree about what shipped.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "SSDP.UPnP.PCL $version" \
            --generate-notes \
            --verify-tag \
            artifacts/*.nupkg
